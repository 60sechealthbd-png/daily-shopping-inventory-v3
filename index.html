<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Shopping Inventory</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font-family:system-ui,Arial;margin:0;background:#f2f5f7;color:#17252d}main{max-width:490px;margin:auto;padding:18px}h2{margin:8px 0}.hint{color:#52646c;font-size:13px}.card{background:white;border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 2px 8px #0001}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b7c5cd;border-radius:9px;font-size:17px}button{border:0;background:#006e73;color:white;border-radius:9px;padding:13px;font-size:16px;font-weight:700;width:100%;margin-top:12px}button:disabled{opacity:.5}.msg{margin-top:12px;font-size:14px;white-space:pre-wrap}.error{color:#a32727}.ok{color:#126a38}.item{border:1px solid #d4e1e5;border-radius:8px;padding:10px;margin:8px 0}#reader{width:100%}</style></head><body><main><h2>Daily Shopping Inventory</h2><div class="hint">Scan → choose item → quantity → save → scan next</div><div class="card"><label>Staff name</label><input id="staff" placeholder="Staff name"><label>Inventory session (same on all phones)</label><input id="session" placeholder="e.g. INV-2026-11-09"><label>Assigned section</label><input id="section" placeholder="e.g. Beverages"><label>Counting location</label><select id="location"><option value="Shop Floor">Shop Floor / Shelf</option><option value="Store Room">Store Room</option></select></div><div class="card"><div id="reader"></div><button id="scanBtn" onclick="startScan()">📷 Scan with camera</button><button id="stopBtn" onclick="stopScan()" style="display:none;background:#596970">Stop camera</button><label>Barcode (manual entry)</label><input id="barcode" inputmode="numeric"><button onclick="lookup()">Find product</button><div id="results"></div></div><div class="card" id="countBox" style="display:none"><div id="chosen"></div><div id="duplicateWarning" class="msg error" style="display:none"></div><label>Physical quantity</label><input id="qty" type="number" min="0" step="1" inputmode="numeric"><label id="notesLabel" style="display:none">Unknown item notes</label><textarea id="notes" style="display:none"></textarea><button id="saveBtn" onclick="save()">Save count</button></div><div id="status" class="msg"></div></main><script>
// Set these TWO values before publishing.
const API_URL='PASTE_NEW_V3_WEB_APP_URL_HERE';
const APP_KEY='Daily-shopping-inventory-apps-5264986';
const $=id=>document.getElementById(id);
let products={},selected=null,unknown=false,scanner=null,scanning=false,busy=false;
function status(t,err=false){$('status').textContent=t;$('status').className='msg '+(err?'error':'ok')}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Math.random().toString(36).slice(2)+Date.now();const s=document.createElement('script');let done=false;const finish=(err,val)=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(val)};window[cb]=v=>finish(null,v);s.onerror=()=>finish(Error('Network error'));const timer=setTimeout(()=>finish(Error('Server timeout')),30000);s.src=API_URL+'?'+new URLSearchParams({...params,key:APP_KEY,callback:cb});document.head.appendChild(s)})}
async function loadStock(){status('Loading stock list...');try{const r=await jsonp({action:'stock'});if(!r.ok)throw Error(r.error);products={};for(const p of r.items){(products[p.barcode]??=[]).push(p)}status('Ready: '+r.items.length+' products loaded')}catch(e){status('Could not load stock: '+e.message,true)}}
function context(){return {session:$('session').value.trim(),staff:$('staff').value.trim(),section:$('section').value.trim(),location:$('location').value}}
function contextValid(){const c=context();if(!/^[A-Za-z0-9_-]{3,40}$/.test(c.session)||!c.staff||!c.section){status('Enter Session ID, Staff and Section before scanning',true);return false}return true}
function lookup(){const b=$('barcode').value.trim();if(!b){status('Enter barcode',true);return}if(!contextValid())return;const items=products[b]||[];$('results').textContent='';$('countBox').style.display='none';if(!items.length){unknown=true;choose({barcode:b,code:''});return}unknown=false;if(items.length===1){choose(items[0]);return}const box=$('results');box.append('Choose the correct item:');items.forEach(item=>{const btn=document.createElement('button');btn.textContent=item.name+' | Code: '+item.code;btn.onclick=()=>choose(item);box.append(btn)})}
async function choose(item){selected=item;$('results').textContent='';$('chosen').textContent=unknown?'Unknown barcode: '+item.barcode:item.name+' | Code: '+item.code+' | Stock: '+item.stock;$('notes').style.display=unknown?'block':'none';$('notesLabel').style.display=unknown?'block':'none';$('qty').value='';$('countBox').style.display='block';$('duplicateWarning').style.display='none';$('saveBtn').disabled=true;status('Checking previous count...');try{const r=await jsonp({action:'duplicate',...context(),barcode:item.barcode,code:item.code});if(!r.ok)throw Error(r.error);if(r.duplicate){const prev=r.previous||{};$('duplicateWarning').textContent='ALREADY COUNTED! Staff: '+(prev.staff||'?')+' | Quantity: '+(prev.qty||'0')+' | Same session, section and location. Save blocked.';$('duplicateWarning').style.display='block';status('Duplicate found — cannot save',true)}else{$('saveBtn').disabled=false;status('Not counted in this location yet');$('qty').focus()}}catch(e){status('Duplicate check failed: '+e.message,true)}}
async function startScan(){if(scanning)return;if(!contextValid())return;if(typeof Html5Qrcode==='undefined'){status('Scanner library unavailable. Check internet.',true);return}try{scanner=new Html5Qrcode('reader');scanning=true;$('scanBtn').style.display='none';$('stopBtn').style.display='block';await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},async code=>{if(busy)return;busy=true;$('barcode').value=code;await stopScan();lookup();busy=false},()=>{});}catch(e){status('Camera error: '+e,true);await stopScan()}}
async function stopScan(){scanning=false;$('scanBtn').style.display='block';$('stopBtn').style.display='none';if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}}
async function save(){if(!selected||$('saveBtn').disabled)return;if(!contextValid())return;const qty=$('qty').value;if(qty===''||!Number.isSafeInteger(Number(qty))||Number(qty)<0){status('Enter whole-number quantity',true);return}const id='id_'+Date.now()+'_'+Math.random().toString(36).slice(2,12);const data={action:'save',key:APP_KEY,id,...context(),barcode:selected.barcode,code:selected.code,qty};$('saveBtn').disabled=true;status('Saving...');try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});let result=null;for(let n=0;n<12;n++){await new Promise(r=>setTimeout(r,1300));const check=await jsonp({action:'check',id});if(!check.ok)throw Error(check.error);if(check.found){result=check;break}}if(!result)throw Error('Save not confirmed. Check Inventory_V3_Counts and Inventory_V3_Requests before retrying.');if(result.status==='DUPLICATE'){const prev=result.previous||{};$('duplicateWarning').textContent='ALREADY COUNTED! Staff: '+(prev.staff||'?')+' | Quantity: '+(prev.qty||'0');$('duplicateWarning').style.display='block';status('Duplicate blocked by server',true);return}if(result.status!=='SAVED')throw Error(result.message||'Save failed');status('Count saved successfully');$('countBox').style.display='none';$('barcode').value='';selected=null;$('barcode').focus()}catch(e){status(e.message,true)}finally{if(selected&&$('duplicateWarning').style.display==='none')$('saveBtn').disabled=false}}
loadStock();</script></body></html>
